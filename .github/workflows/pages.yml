name: Deploy web game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "sql_detective/**"
      - "tests/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "web/**"
      - "sql_detective/**"
      - "tests/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Verify cases and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run Python tests
        run: python -m pytest

      - name: Regenerate case data and fail on drift
        run: |
          python -m sql_detective.web_cases --count 100 --output web/cases.json
          git diff --exit-code -- web/cases.json

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run web logic tests
        run: node web/logic.test.mjs

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
